# Opt in with: docker compose -f compose.yaml -f compose.credentials.yaml up -d
services:
  api:
    environment:
      Vessel__Credentials__KeyFile: /run/secrets/vessel-credential-keys.json
    volumes:
      - type: bind
        source: ${VESSEL_CREDENTIAL_KEYS_FILE:?Set the absolute path of the private key ring}
        target: /run/secrets/vessel-credential-keys.json
        read_only: true
        bind:
          create_host_path: false
