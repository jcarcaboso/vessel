# Opt in explicitly, together with compose.tls.yaml (or your own HTTPS proxy).
# Keep this overlay on EVERY command, including migrate and offline identity commands.
# Persist VESSEL_AUTH_MODE=Wallet and the complete COMPOSE_FILE in private .env;
# missing overlays then fail closed rather than reverting to Token.
x-wallet-environment: &wallet-environment
  Vessel__Auth__Mode: Wallet
  Vessel__Auth__Token: ""
  Vessel__Auth__OwnerName: ${Vessel__Auth__OwnerName:-Owner}
  Vessel__Identity__Origins__0: ${VESSEL_IDENTITY_ORIGIN:?Set the public HTTPS origin, without a path}
  # §10 is not signed off; only opt into broader registration after acceptance.
  Vessel__Identity__Registration: ${VESSEL_IDENTITY_REGISTRATION:-Closed}
  Vessel__Identity__AllowLegacyDefaultOwner: ${VESSEL_ALLOW_LEGACY_DEFAULT_OWNER:-false}

services:
  migrate:
    environment:
      <<: *wallet-environment
  api:
    environment:
      <<: *wallet-environment
  worker:
    environment:
      <<: *wallet-environment
  worker-notifications:
    environment:
      <<: *wallet-environment
