name: vessel

services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: vessel-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in the ignored .env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the ignored .env file}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1"
    ports:
      - "127.0.0.1:55672:5672"
      - "127.0.0.1:55673:15672"
    volumes:
      - vessel-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vessel
      POSTGRES_USER: vessel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file or process environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18 image data is nested beneath this parent directory.
      - vessel-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel -d vessel"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vessel-postgres:
  vessel-rabbitmq:
