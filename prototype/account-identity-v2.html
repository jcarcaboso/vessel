<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Account identity · styled options · Vessel</title>
<!-- Disposable, self-contained comparison (no external files) so it can be opened directly, shown inline or captured.
     Synthetic accounts only. Graphite tokens copied from frontend/src/styles.css. Venue accents would come from the venue
     descriptor next to its logo, not from the theme. -->
<style>
.vx {
  color-scheme: dark;
  --background: #0f1114; --foreground: #e9edf2; --card: #171a1f; --popover: #1a1e24;
  --muted: #1e2229; --muted-foreground: #abb3c0; --accent: #242932; --border: #394350; --ring: #9ab5f2; --field: #111419;
  --positive: #a9d6b6;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #9085e9;
  --radius: 0.4375rem;
  --brand: var(--ring);
  --brand-wash: color-mix(in srgb, var(--ring) 10%, transparent);
  --line: color-mix(in srgb, var(--border) 60%, var(--card));
  --surface-sunken: color-mix(in srgb, var(--background) 55%, var(--card));
  --sheen: rgb(255 255 255 / 0.045);
  --radius-panel: calc(var(--radius) + 4px);
  --radius-control: max(4px, calc(var(--radius) - 1px));
  --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --figures: 'tnum' 1, 'cv11' 1, 'ss01' 1;
  font: 13px/1.4 'Inter Variable', Inter, var(--font-sans, system-ui), sans-serif;
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
  background: #0b0d10; padding: 18px; border-radius: 14px;
}
.vx * { box-sizing: border-box; }
:where(.vx) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.vx-section { margin: 0 0 22px; }
.vx-section > h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: var(--foreground); }
.vx-shot { background: #0b0d10; }
.vx-section > p { margin: 0 0 12px; color: var(--muted-foreground); font-size: 12.5px; }

/* Option switcher */
.vx-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.vx-tab { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted-foreground); font-weight: 550; font-size: 12px; transition: all .15s; }
.vx-tab b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); color: var(--foreground); font-size: 11px; }
.vx-tab:hover { color: var(--foreground); border-color: var(--border); }
.vx-tab[aria-selected="true"] { color: var(--foreground); border-color: color-mix(in srgb, var(--ring) 55%, var(--border)); background: color-mix(in srgb, var(--ring) 12%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 12%, transparent); }
.vx-tab[aria-selected="true"] b { background: var(--ring); color: #11161d; }
.vx-pitch { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--muted-foreground); font-size: 12.5px; }
.vx-pitch strong { color: var(--foreground); font-weight: 600; }

/* Screen mock */
.vx-screen { align-content: start; padding: 18px; border-radius: 14px; background: var(--background); border: 1px solid var(--line); display: grid; gap: 14px; }

/* ---------- Shared identity atoms ---------- */
.ava { --s: 26px; position: relative; flex: none; display: grid; place-items: center; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .3); background: var(--muted); border: 1px solid color-mix(in srgb, var(--venue, var(--border)) 30%, var(--border)); color: var(--muted-foreground); }
.ava img { width: 100%; height: 100%; border-radius: inherit; display: block; }
.ava svg { width: 60%; height: 60%; }
.ava.sm { --s: 20px; }
.ava.lg { --s: 34px; }
.ava.xl { --s: 44px; }
.ava.ring { box-shadow: 0 0 0 2px var(--ring-gap, var(--card)), 0 0 0 4px var(--slice); border-color: transparent; }
.ava.glow::after { content: ''; position: absolute; inset: -8px; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--venue) 38%, transparent), transparent); }
.ava .dot { position: absolute; right: -4px; bottom: -4px; width: 11px; height: 11px; border-radius: 50%; background: var(--slice); box-shadow: 0 0 0 2px var(--ring-gap, var(--card)); }
.ava .tick { position: absolute; right: -5px; bottom: -5px; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: var(--ring); color: #11161d; box-shadow: 0 0 0 2px var(--popover); }
.ava .tick svg { width: 10px; height: 10px; }
.vtag { display: inline-flex; align-items: center; gap: 5px; flex: 0 1 auto; min-width: 0; height: 19px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 560; letter-spacing: .01em; white-space: nowrap; color: color-mix(in srgb, var(--venue) 68%, var(--foreground)); background: color-mix(in srgb, var(--venue) 13%, transparent); border: 1px solid color-mix(in srgb, var(--venue) 28%, transparent); }
.vtag > span { overflow: hidden; text-overflow: ellipsis; }
.vtag img { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.addr { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 19px; padding: 0 6px; border-radius: 6px; font: 500 11px/1 var(--mono); color: var(--muted-foreground); background: color-mix(in srgb, var(--foreground) 5%, transparent); border: 1px solid color-mix(in srgb, var(--foreground) 7%, transparent); }
.addr.manual { font-family: inherit; font-style: italic; }
.addr svg { width: 11px; height: 11px; opacity: 0; transition: opacity .15s; }
*:hover > .addr svg, .addr:hover svg { opacity: .8; }
.nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--foreground); }
.nm.unnamed { font-family: var(--mono); font-weight: 550; font-size: .95em; }
.unnamed-tag { flex: none; font-size: 11px; color: var(--muted-foreground); padding: 0 6px; height: 17px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px dashed var(--border); }
.share { font-weight: 650; font-variant-numeric: tabular-nums; font-feature-settings: var(--figures); }

/* ---------- Allocation card ---------- */
.alloc-pair { display: grid; gap: 14px; }
.card { --ring-gap: var(--surface-sunken); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 14px; background: var(--surface-sunken); min-width: 0; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; font-size: 11px; color: var(--muted-foreground); }
.card > header .pf { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--foreground); font-size: 13px; font-weight: 560; }
.card > header .pf span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card > header .pf svg { color: var(--brand); flex: none; }
.card-body { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: center; }
.card-body.stack { grid-template-columns: minmax(0, 1fr); justify-items: stretch; }
.card-body.stack .donut { justify-self: center; }
.donut { position: relative; width: 112px; height: 112px; }
.donut svg { width: 100%; height: 100%; overflow: visible; }
.donut path { stroke: var(--surface-sunken); stroke-width: 2.5; transition: opacity .15s, transform .15s; }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .c strong { font-size: 13px; font-weight: 650; }
.donut .c small { font-size: 11px; color: var(--muted-foreground); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0; }

/* L1 · capsules */
.l-capsule li { --ring-gap: color-mix(in srgb, var(--venue) 6%, var(--surface-sunken)); display: flex; align-items: center; gap: 11px; min-width: 0; padding: 7px 10px 7px 8px; border-radius: 12px; background: linear-gradient(100deg, color-mix(in srgb, var(--venue) 9%, var(--surface-sunken)), var(--surface-sunken) 70%); border: 1px solid color-mix(in srgb, var(--venue) 16%, var(--line)); transition: transform .15s, border-color .15s; }
.l-capsule li:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--slice) 55%, var(--line)); }
.l-capsule .main { display: grid; gap: 4px; min-width: 0; flex: 1; }
.l-capsule .top, .l-capsule .bot { display: flex; align-items: center; gap: 6px; min-width: 0; }
.l-capsule .right { display: grid; justify-items: end; gap: 5px; flex: none; }
.l-capsule .bar { width: 46px; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--foreground) 8%, transparent); overflow: hidden; }
.l-capsule .bar i { display: block; height: 100%; border-radius: inherit; background: var(--slice); box-shadow: 0 0 8px var(--slice); }

/* L2 · share bars */
.l-bars li { position: relative; display: flex; align-items: center; gap: 9px; min-width: 0; height: 38px; padding: 0 12px 0 10px; border-radius: 10px; overflow: hidden; background: color-mix(in srgb, var(--foreground) 3%, transparent); }
.l-bars li::before { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--pct); background: linear-gradient(90deg, color-mix(in srgb, var(--slice) 30%, transparent), color-mix(in srgb, var(--slice) 14%, transparent)); border-right: 1px solid color-mix(in srgb, var(--slice) 60%, transparent); }
.l-bars li::after { content: ''; position: absolute; inset: 6px auto 6px 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--slice); }
.l-bars li > * { position: relative; }
.l-bars .meta { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.l-bars .vtag { --venue: var(--foreground); }
.l-bars .share { margin-left: auto; }

/* L3 · tiles */
.l-tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.l-tiles li { position: relative; display: grid; gap: 7px; align-content: start; min-width: 0; padding: 12px 11px 10px; border-radius: 12px; overflow: hidden; isolation: isolate; background: color-mix(in srgb, var(--card) 70%, var(--surface-sunken)); border: 1px solid var(--line); transition: transform .15s, border-color .15s; }
.l-tiles li::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--slice); box-shadow: 0 0 14px 1px var(--slice); }
.l-tiles li::after { content: ''; position: absolute; z-index: -1; width: 120px; height: 120px; top: -60px; right: -50px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--venue) 26%, transparent), transparent); }
.l-tiles li:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--slice) 50%, var(--line)); }
.l-tiles .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.l-tiles .share { font-size: 17px; letter-spacing: -.01em; }
.l-tiles .nm { font-size: 13px; }
.l-tiles .tags { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.l-tiles .money { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

/* L4 · compact + hover card */
.l-hover li { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 5px 8px; border-radius: 9px; cursor: default; }
.l-hover li:hover, .l-hover li.is-hover { background: var(--accent); }
.l-hover .share { margin-left: auto; }
.l-hover .nm { font-weight: 560; }
.hovercard { position: absolute; z-index: 5; left: 34px; top: calc(100% + 6px); width: 280px; padding: 14px; border-radius: 14px; pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s;
  background: linear-gradient(160deg, color-mix(in srgb, var(--venue) 16%, var(--popover)), var(--popover) 55%); border: 1px solid color-mix(in srgb, var(--venue) 24%, var(--border));
  box-shadow: 0 24px 50px -18px rgb(0 0 0 / .75), 0 0 0 1px rgb(255 255 255 / .03) inset; --ring-gap: var(--popover); }
.l-hover li:hover .hovercard, .l-hover li.is-hover .hovercard { opacity: 1; transform: none; }
.hovercard .hc-top { display: flex; align-items: center; gap: 11px; }
.hovercard .hc-top > div { display: grid; gap: 4px; min-width: 0; }
.hovercard .hc-name { font-size: 14px; }
.hovercard dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; }
.hovercard dt { color: var(--muted-foreground); }
.hovercard dd { margin: 0; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hovercard dd.full { font: 500 11px var(--mono); color: var(--foreground); }

/* Today */
.l-today li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; font-size: 12px; }
.l-today .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--slice); flex: none; }
.l-today .share { margin-left: auto; font-weight: 600; }

/* ---------- Selector ---------- */
.filters { position: relative; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); }
.filters > label, .filters > .fl { display: grid; gap: 5px; color: var(--muted-foreground); font-size: 12px; flex: 1 1 130px; min-width: 0; position: relative; }
.filters > .acc { flex: 0 1 236px; }
.fsel { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; padding: 0 10px; border-radius: var(--radius-control); background: var(--field); border: 1px solid var(--border); color: var(--foreground); font-size: 13px; white-space: nowrap; overflow: hidden; }
.fsel svg { flex: none; color: var(--muted-foreground); }
.trigger { --ring-gap: var(--field); width: 100%; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 9px 0 6px; border-radius: var(--radius-control); background: linear-gradient(100deg, color-mix(in srgb, var(--venue, transparent) 10%, var(--field)), var(--field) 75%); border: 1px solid color-mix(in srgb, var(--venue, var(--border)) 22%, var(--border)); text-align: left; transition: border-color .15s, box-shadow .15s; }
.trigger:hover { border-color: color-mix(in srgb, var(--ring) 45%, var(--border)); }
.trigger[aria-expanded="true"] { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.trigger .nm { flex: 0 1 auto; }
.trigger .vtag { height: 18px; padding: 0 6px; }
.trigger .chev { margin-left: auto; flex: none; color: var(--muted-foreground); transition: transform .15s; }
.trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
.stackava { display: inline-flex; flex: none; padding-left: 6px; }
.stackava .ava { --s: 20px; margin-left: -6px; box-shadow: 0 0 0 2px var(--ring-gap, var(--field)); border-color: transparent; }
.pop { position: absolute; z-index: 10; top: calc(100% + 8px); left: 0; width: 400px; max-width: calc(100vw - 40px); border-radius: 16px; overflow: hidden; --ring-gap: var(--popover);
  background: color-mix(in srgb, var(--popover) 94%, transparent); backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--foreground) 10%, var(--border));
  box-shadow: 0 30px 60px -20px rgb(0 0 0 / .8), 0 0 0 1px rgb(255 255 255 / .02) inset; }
.pop[hidden] { display: none; }
.pop-search { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); color: var(--muted-foreground); }
.pop-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--foreground); font: inherit; font-size: 13px; }
.pop-search kbd, .pop-foot kbd { font: 500 10.5px/1 inherit; padding: 3px 5px; border-radius: 5px; border: 1px solid var(--border); background: var(--muted); color: var(--muted-foreground); }
.chips { display: flex; gap: 6px; padding: 10px 12px 4px; overflow-x: auto; scrollbar-width: none; }
.chip { --ring-gap: var(--popover); display: inline-flex; align-items: center; gap: 6px; flex: none; height: 26px; padding: 0 10px 0 4px; border-radius: 999px; font-size: 12px; font-weight: 550; color: var(--muted-foreground); border: 1px solid var(--line); background: color-mix(in srgb, var(--foreground) 3%, transparent); transition: all .15s; }
.chip.text-only { padding: 0 11px; }
.chip img { width: 18px; height: 18px; border-radius: 50%; }
.chip:hover { color: var(--foreground); }
.chip[aria-pressed="true"] { color: var(--foreground); background: color-mix(in srgb, var(--venue, var(--ring)) 16%, transparent); border-color: color-mix(in srgb, var(--venue, var(--ring)) 45%, transparent); }
.chip .count { font-size: 11px; opacity: .7; }
.opts { list-style: none; margin: 0; padding: 6px; max-height: 330px; overflow: auto; }
.opt { --ring-gap: var(--popover); position: relative; display: flex; align-items: center; gap: 11px; min-width: 0; padding: 8px 10px; border-radius: 11px; cursor: pointer; transition: background .12s; }
.opt:hover, .opt.is-active { background: color-mix(in srgb, var(--venue, var(--foreground)) 8%, var(--accent)); }
.opt[aria-selected="true"] { background: color-mix(in srgb, var(--ring) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ring) 30%, transparent); }
.opt .main { display: grid; gap: 4px; min-width: 0; flex: 1; }
.opt .top, .opt .bot { display: flex; align-items: center; gap: 6px; min-width: 0; }
.opt .right { display: grid; justify-items: end; gap: 3px; flex: none; font-size: 12px; font-variant-numeric: tabular-nums; }
.opt .right small { color: var(--muted-foreground); font-size: 11px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .right b.bal { font-weight: 600; }
.opt mark { background: color-mix(in srgb, var(--ring) 30%, transparent); color: inherit; border-radius: 3px; }
.opt-all .nm { font-weight: 600; }
.opt-all small { color: var(--muted-foreground); font-size: 11px; }
.pop-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted-foreground); font-size: 11px; }
.pop-empty { padding: 26px; text-align: center; color: var(--muted-foreground); }

/* S2 · tiles */
.pop.tiles { width: 470px; }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px; max-height: 380px; overflow: auto; }
.tile { --ring-gap: var(--popover); position: relative; display: grid; gap: 7px; align-content: start; min-width: 0; padding: 12px; border-radius: 13px; text-align: left; overflow: hidden; isolation: isolate; cursor: pointer;
  background: linear-gradient(150deg, color-mix(in srgb, var(--venue, var(--foreground)) 13%, var(--card)), var(--card) 60%); border: 1px solid color-mix(in srgb, var(--venue, var(--foreground)) 16%, var(--line)); transition: transform .15s, border-color .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--venue, var(--ring)) 45%, var(--line)); }
.tile[aria-selected="true"] { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent), 0 10px 26px -12px color-mix(in srgb, var(--ring) 50%, transparent); }
.tile .head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tile .bal { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12px; }
.tile .nm { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.3; }
.tile .tags { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.tile.wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.tile.wide small { color: var(--muted-foreground); font-size: 11px; }
.tile .pfl { font-size: 11px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* S3 · chip rail */
.rail { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); }
.rail > .lbl { font-size: 12px; color: var(--muted-foreground); margin-right: 4px; }
.rail .chip { height: 32px; padding: 0 12px 0 4px; font-size: 12.5px; }
.rail .chip .ava { --s: 24px; border-radius: 50%; }
.rail .chip .ava img { border-radius: 50%; }
.rail .chip .addr { height: 17px; font-size: 10.5px; }
.rail .chip.more { padding: 0 10px; }
.rail-wrap { position: relative; }
.rail-wrap .pop { top: calc(100% + 6px); left: auto; right: 0; }

/* Today's native list */
.native { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; min-width: 100%; padding: 5px; border-radius: 9px; background: #1d2026; border: 1px solid #3a3f48; box-shadow: 0 12px 30px rgb(0 0 0 / .5); font: 14px system-ui, sans-serif; color: #e8e8e8; }
.native div { padding: 5px 10px 5px 26px; border-radius: 5px; }
.native div.sel { padding-left: 10px; }
.sel-stage { min-height: 640px; }
.l-tiles .unnamed-tag { display: none; }
</style>
</head>

<div class="vx" id="vx"></div>
<script>

const svgLogo = {

}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

function shortSource(v) {
  if (!v) return null
  if (/^0x[\da-f]{40}$/i.test(v)) return `${v.slice(0, 6)}…${v.slice(-4)}`
  if (/^\d+$/.test(v)) return v.length > 10 ? `#${v.slice(0, 4)}…${v.slice(-4)}` : `#${v}`
  return v.length > 16 ? `${v.slice(0, 8)}…${v.slice(-4)}` : v
}
const V = a => venues[a.venue]
const named = a => a.name.trim() !== ''
const key = a => a.name.trim().toLowerCase()
const ambiguous = a => !named(a) || accounts.filter(b => key(b) === key(a)).length > 1
const vars = (a, slot) => `--venue:${V(a).accent};${slot ? `--slice:var(--series-${slot});` : ''}`
const title = a => `${named(a) ? a.name : 'Unnamed account'} · ${V(a).name} · ${a.source ?? 'Manual record'}`

const ava = (a, cls = '', extra = '') => { const v = V(a); return `<span class="ava ${cls}" style="--venue:${v.accent}">${v.logo ? `<img src="${logoUrl(v.logo)}" alt="">` : ic(v.icon)}${extra}</span>` }
const vtag = (a, withLogo = false) => { const v = V(a); return `<span class="vtag" title="${esc(v.name)}" style="--venue:${v.accent}">${withLogo && v.logo ? `<img src="${logoUrl(v.logo)}" alt="">` : ''}<span>${esc(v.name)}</span></span>` }
const addr = a => a.source ? `<span class="addr" title="${esc(a.source)}">${esc(shortSource(a.source))}${ic('copy', 11)}</span>` : '<span class="addr manual">Manual record</span>'
const addrIf = a => named(a) ? addr(a) : ''
const nm = (a, q) => named(a) ? `<span class="nm">${mark(a.name, q)}</span>` : `<span class="nm unnamed">${esc(shortSource(a.source))}</span><span class="unnamed-tag">Unnamed</span>`
const mark = (text, q) => q ? esc(text).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>') : esc(text)

// ---------- donut ----------
const tau = Math.PI * 2
const pt = (r, a) => `${(r * Math.sin(a)).toFixed(3)} ${(-r * Math.cos(a)).toFixed(3)}`
function arc(o, i, s, e) {
  if (e - s >= tau - 1e-6) return `M ${pt(o, 0)} A ${o} ${o} 0 1 1 ${pt(o, Math.PI)} A ${o} ${o} 0 1 1 ${pt(o, 0)} M ${pt(i, 0)} A ${i} ${i} 0 1 0 ${pt(i, Math.PI)} A ${i} ${i} 0 1 0 ${pt(i, 0)} Z`
  const l = e - s > Math.PI ? 1 : 0
  return `M ${pt(o, s)} A ${o} ${o} 0 ${l} 1 ${pt(o, e)} L ${pt(i, e)} A ${i} ${i} 0 ${l} 0 ${pt(i, s)} Z`
}
function donut(g) {
  let at = 0
  const p = g.slices.map(([, slot, pct]) => { const s = at; at += pct / 100 * tau; return `<path d="${arc(52, 33, s, at)}" fill="var(--series-${slot})"/>` }).join('')
  return `<div class="donut"><svg viewBox="-56 -56 112 112" aria-hidden="true">${p}</svg><div class="c"><strong>${g.short}</strong><small>${g.count} ${g.count === 1 ? 'account' : 'accounts'}</small></div></div>`
}

const legends = {

  },

function card(g, legendKey, hoverFirst) {
  const L = legends[legendKey]

  return `<article class="card"><header><span class="pf">${ic('folder', 15)}<span>${esc(g.name)}</span></span><span>${g.note}</span></header>
    <div class="card-body${stack ? ' stack' : ''}">${donut(g)}<ul class="legend l-${legendKey}">${g.slices.map(([id, slot, pct], i) => L.row(byId[id], slot, pct, hoverFirst && i === 0)).join('')}</ul></div></article>`

const optRow = a => `<li class="opt" role="option" data-pick="${a.id}" aria-selected="${state.sel === a.id}" style="--venue:${V(a).accent}" title="${esc(title(a))}">${ava(a, 'lg glow', state.sel === a.id ? `<span class="tick">${ic('check')}</span>` : '')}<span class="main"><span class="top">${nm(a, state.q)}</span><span class="bot">${vtag(a)}${addrIf(a)}</span></span><span class="right"><b class="bal">${a.bal}</b><small>${esc(a.portfolio ? portfolios[a.portfolio] : 'Unassigned')}</small></span></li>`

const selectors = {

  rail: {

        <div class="pop" ${state.open ? '' : 'hidden'}><div class="pop-search">${ic('search')}<input data-input="q" placeholder="Search name, venue, address…" value="${esc(state.q)}"><kbd>Esc</kbd></div><ul class="opts">${accounts.slice(4).filter(matches).map(optRow).join('')}</ul></div></div>

// ---------- page ----------
const root = document.getElementById('vx')
const params = new URLSearchParams(location.search)
let legendKey = params.get('legend') || 'capsule', selKey = params.get('selector') || 'command'
const only = params.get('only')
function tabs(map, current, kind) {
  return `<div class="vx-tabs" role="tablist">${Object.entries(map).map(([k, v], i) => `<button class="vx-tab" role="tab" data-${kind}="${k}" aria-selected="${k === current}"><b>${i === 0 ? '–' : i}</b>${v.label}</button>`).join('')}</div>`
}
function render() {
  const L = legends[legendKey], S = selectors[selKey]
  const legendHtml = `<section class="vx-section" data-capture="legend-${legendKey}"><h2>Allocation legend</h2><p>Your three accounts, then a stress portfolio: long name, unnamed account, unknown long venue, two “main” on one venue, manual record.</p>
    ${tabs(legends, legendKey, 'legend')}<div class="vx-shot" data-shot="legend-${legendKey}"><div class="vx-pitch">${L.pitch}</div>
    <div class="vx-screen"><div class="alloc-pair">${card(groups[0], legendKey, legendKey === 'hover')}${legendKey === 'hover' ? '' : card(groups[1], legendKey)}${card(groups[2], legendKey)}</div></div></div></section>`
  const selHtml = `<section class="vx-section" data-capture="selector-${selKey}"><h2>Account selector</h2><p>Activity filter and the other account filters. Interactive: open, search, filter by venue and pick.</p>
    ${tabs(selectors, selKey, 'selector')}<div class="vx-shot" data-shot="selector-${selKey}"><div class="vx-pitch">${S.pitch}</div>
    <div class="vx-screen sel-stage">${S.render()}</div></div></section>`
  root.innerHTML = only === 'legend' ? legendHtml : only === 'selector' ? selHtml : legendHtml + selHtml
}
root.addEventListener('click', e => {
