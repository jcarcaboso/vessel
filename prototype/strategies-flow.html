<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Vessel · Strategies (proposed shape)</title>
<link rel="stylesheet" href="strategies-shape.css">
<style>
.crumb{display:flex;align-items:center;gap:8px}.crumb button{background:none;border:0;padding:0;color:var(--muted-fg);font-size:10px}.crumb button:hover{color:var(--foreground);background:none}
.shape-note{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.shape-note span{font-size:10px;color:var(--muted-fg);border:1px dashed #3b4553;border-radius:5px;padding:5px 9px}.shape-note b{color:#d3dbe8;font-weight:600}
/* library */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.group-title{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-fg);font-weight:600;margin:20px 0 8px;display:flex;gap:8px;align-items:center}.group-title:first-child{margin-top:0}
.s-row{display:grid;grid-template-columns:120px minmax(0,1.6fr) minmax(0,1fr) 210px;gap:18px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;margin-bottom:8px;font-weight:400}.s-row:hover{background:#1c2128;border-color:#4c596b}
.s-row h3{font-size:14px;font-weight:600;letter-spacing:-.2px;margin-bottom:5px}.s-row p{font-size:11px;line-height:1.65;color:#c3cbd7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-row .scope{display:flex;gap:5px;flex-wrap:wrap}.s-row .meta{font-size:10px;color:var(--muted-fg);line-height:1.7}
.strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.strip i{width:10px;height:10px;border-radius:2px;background:#2e3540}.strip i.Positive{background:var(--pos-mark)}.strip i.Negative{background:var(--neg-mark)}.strip i.Flat{background:var(--flat-mark)}.strip i.Notrade{background:none;border:1.5px solid #6c7685;border-radius:50%}.strip i.Inprogress{background:none;border:1.5px dashed #6c7685}.strip i.dev{background:none!important;border:2px solid var(--warning)}
/* strategy page */
.s-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:6px}.s-head h1{font-size:26px;font-weight:650;letter-spacing:-.8px;margin:8px 0 6px}.s-head .thesis{font-size:13px;line-height:1.8;color:#cfd6e0;max-width:820px}
.s-head .actions{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.page-tabs{margin:16px 0 20px;padding:0;border-bottom:1px solid var(--border)}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
.sec{padding:18px 20px;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h3{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted-fg);font-weight:600;margin-bottom:12px}
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 18px}.scope-grid dt{font-size:9px;color:var(--muted-fg);margin-bottom:5px}.scope-grid dd{margin:0;font-size:12px;display:flex;gap:5px;flex-wrap:wrap}
.rule-groups{display:grid;gap:14px}.rg h4{font-size:10px;font-weight:600;color:#cfd6e0;margin-bottom:6px;display:flex;gap:8px;align-items:center}.rg h4 span{font-weight:400;color:var(--faint)}
.rl{list-style:none;margin:0;padding:0}.rl li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.6}.rl li:first-child{border-top:0}.rl .opt{font-size:9px;color:var(--faint);border:1px solid #363d48;border-radius:3px;padding:0 5px;flex:none}
.prose{font-size:12px;line-height:1.8;color:#d6dde7}
.pred{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:11px;line-height:1.6}.pred:first-of-type{border-top:0}.pred select{font-size:10px;padding:4px 6px}
.ex{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.ex:first-of-type{border-top:0}.ex svg{width:86px;height:52px;border-radius:4px;background:var(--field);border:1px solid var(--line)}.ex p{font-size:11px;line-height:1.6}.ex small{color:var(--muted-fg)}
.inplay{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:12px}.inplay .cond{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:11px}.inplay .cond:first-of-type{border-top:0}
/* behaviour */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}.tile b{display:block;font-size:22px;font-weight:600;letter-spacing:-.6px;margin:4px 0 2px}.tile small{color:var(--muted-fg)}
.chart{width:100%;height:auto;display:block}.chart text{font-family:Manrope,system-ui,sans-serif}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:10px;color:var(--muted-fg);align-items:center}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#232933;border:1px solid #4c596b;border-radius:6px;padding:8px 10px;font-size:10px;line-height:1.6;max-width:260px;z-index:8;box-shadow:0 6px 18px #0008}.tip b{font-weight:600}
.matrix{display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr));gap:4px;font-size:10px}.matrix .h{color:var(--muted-fg);font-size:9px;padding:4px;align-self:end}.matrix .rh{color:var(--muted-fg);align-self:center}
.cell{min-height:56px;border-radius:5px;border:1px solid var(--line);background:var(--card-2);padding:6px 8px;text-align:left;font-weight:400;display:flex;flex-direction:column;justify-content:space-between}.cell b{font-size:17px;font-weight:550}.cell small{font-size:8px;line-height:1.35;color:var(--muted-fg)}.cell[aria-pressed=true]{border-color:var(--primary);background:#232a35}.cell.zero{opacity:.45}
.adh{display:grid;grid-template-columns:minmax(0,1fr) 120px 74px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:11px;line-height:1.5}.adh:first-of-type{border-top:0}.bar{display:flex;gap:2px;height:8px}.bar span{border-radius:2px}.bar .m{background:#55606f}.bar .b{background:var(--warning)}.bar .n{background:#2e3540}
.progress{height:6px;background:#2a313c;border-radius:3px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--primary)}
/* history */
.vh{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;padding:18px 20px;border-top:1px solid var(--line)}.vh:first-child{border-top:0}.vh .when strong{font-size:14px;display:block}.vh .when small{color:var(--muted-fg)}.vh .reason{font-size:12px;line-height:1.7;color:#d6dde7;margin-bottom:10px}
.diff{list-style:none;margin:0;padding:0;font-size:11px;line-height:1.6}.diff li{padding:3px 0}.diff .add{color:#c6ead0}.diff .rem{color:#e3a69f;text-decoration:line-through}.diff .chg{color:var(--warning)}.diff i{font-style:normal;font-size:9px;color:var(--faint);margin-left:6px}
/* builder / editor */
.builder{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:18px;align-items:start}.builder.sheet{grid-template-columns:170px minmax(0,1fr) 320px}
.steps{list-style:none;margin:0;padding:8px;display:grid;gap:2px}.steps button{width:100%;text-align:left;background:none;border:1px solid transparent;display:flex;gap:10px;align-items:center;padding:9px 10px;font-weight:400;color:var(--muted-fg)}.steps button[aria-current=step]{background:#1f252e;border-color:#394554;color:var(--foreground)}.steps .n{width:20px;height:20px;border-radius:50%;border:1px solid #4c596b;display:grid;place-items:center;font-size:9px;flex:none}.steps .done .n{background:#2a313c;border-color:#7c8da7;color:var(--foreground)}
.form{display:grid;gap:16px}.form .hint{font-size:10px;color:var(--muted-fg);line-height:1.7}.form h2{font-size:16px;font-weight:600;letter-spacing:-.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.composed{font-size:13px;line-height:1.8;background:var(--field);border:1px dashed #4c596b;border-radius:6px;padding:10px 12px;color:#d6dde7}
.rule-edit{display:grid;grid-template-columns:22px 100px minmax(0,1fr) 112px auto;gap:6px;align-items:center;margin-bottom:6px}.rule-edit select{font-size:11px;padding:6px}.rule-edit .ops{display:flex;gap:2px}.rule-edit .ops button{padding:5px 7px}
.rule-edit.changed input{border-color:#695940}.rule-edit.added input{border-color:#3d5a47}
.preview{position:sticky;top:18px}
.changes{list-style:none;margin:0;padding:0;font-size:11px;line-height:1.6}.changes li{padding:5px 0;border-top:1px solid var(--line)}.changes li:first-child{border-top:0}
.sheet-sec{scroll-margin-top:20px}
.thumb{width:120px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;font-size:9px;color:var(--faint);text-align:center}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rn{flex:none;width:20px;height:20px;border-radius:50%;background:#ffd23f;color:#11161d;font-size:10px;font-weight:700;display:inline-grid;place-items:center}.rn.sm{width:16px;height:16px;font-size:9px;vertical-align:-3px}
.rl li[data-hrule]{border-radius:4px;padding-left:4px;padding-right:4px}.rl li[data-hrule]:hover{background:#1c2128}.pic{font-size:9px;padding:2px 7px;border:1px solid #4c596b;border-radius:4px;flex:none}
.ill-panel{margin-bottom:18px}.ill-body{display:grid;grid-template-columns:minmax(0,1fr) 290px}.ill-main{margin:0;padding:16px 18px;min-width:0}.ill-main canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:6px;border:1px solid var(--line);display:block}.ill-main figcaption{margin-top:12px;font-size:12px;line-height:1.7}.ill-main figcaption small{display:block;color:var(--muted-fg);margin-top:2px}
.ill-list{border-left:1px solid var(--border);padding:10px;display:grid;gap:6px;align-content:start;max-height:640px;overflow:auto}.ill-thumb{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;text-align:left;background:none;border:1px solid transparent;padding:6px;font-weight:400;align-items:start}.ill-thumb[aria-pressed=true]{background:#1f252e;border-color:#394554}.ill-thumb img,.ill-thumb i{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block;background:var(--field)}.ill-thumb span{font-size:10px;line-height:1.5;color:#cfd6e0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.ill-thumb b{display:block;font-size:9px;color:var(--muted-fg);font-weight:600}
.ill-empty{display:flex;justify-content:space-between;align-items:center;gap:18px}.badge.cx{color:var(--negative);border-color:#6a4d48;background:#2a1b1a}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.pic-card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card-2)}.pic-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--field)}.pic-card>div{padding:8px 10px;font-size:10px;line-height:1.5}.pic-card b{color:var(--muted-fg);font-size:9px}.pic-card p{color:#cfd6e0;margin-top:3px}
.pic-add{min-height:150px;border:1px dashed #4c596b;background:none;display:grid;place-content:center;gap:6px;text-align:center;font-weight:400}.pic-add b{font-size:12px}.pic-add span{font-size:10px;color:var(--muted-fg)}
.pv-pics{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:12px 12px 0}.pv-pics img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
@media(max-width:1250px){.builder,.builder.sheet{grid-template-columns:180px minmax(0,1fr)}.builder .preview{grid-column:1/-1;position:static}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.two{grid-template-columns:1fr}.s-row{grid-template-columns:120px minmax(0,1fr) 190px}.s-row .scope{display:none}.ill-body{grid-template-columns:1fr}.ill-list{border-left:0;border-top:1px solid var(--border);grid-template-columns:repeat(auto-fill,minmax(240px,1fr));max-height:none}}
@media(max-width:900px){.builder,.builder.sheet{grid-template-columns:1fr}.steps{display:flex;overflow-x:auto}.steps button{white-space:nowrap}.s-head{flex-direction:column}.s-head .actions{justify-content:flex-start}}
@media(max-width:620px){.s-row{grid-template-columns:1fr;gap:10px}.thumb{width:100%}.ill-empty{flex-direction:column;align-items:flex-start}.tiles{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.rule-edit{grid-template-columns:22px 1fr 1fr}.rule-edit input{grid-column:2/-1;grid-row:1}.rule-edit .ops{grid-column:2/-1}.matrix{grid-template-columns:62px repeat(4,minmax(0,1fr));gap:3px}.cell small{display:none}.cell{min-height:44px}.adh{grid-template-columns:minmax(0,1fr) 70px}.adh .bar{display:none}.vh{grid-template-columns:1fr;gap:8px}.s-head h1{font-size:22px}}
</style>
</head>
<body>
<aside class="sidebar">
 <div class="brand"><span class="mono">V</span>Vessel</div>
 <div class="nav-label">WORKSPACE</div>
 <nav class="nav" aria-label="Workspace (mock)"><a href="#"><i></i>Overview</a><a href="#"><i></i>Plays</a><a href="#" class="active" aria-current="page"><i></i>Strategies</a><a href="#"><i></i>Portfolios</a><a href="#"><i></i>Accounts</a><a href="#"><i></i>Activity</a></nav>
 <p class="note">Disposable prototype of the proposed shape. Sample data in browser memory; reload resets it. Ideas: <a href="strategies-create.html">creation</a> · <a href="strategies-review.html">behaviour</a></p>
</aside>
<div class="main">
 <header class="top"><div class="crumb" id="crumb"></div><span class="badge sample">SAMPLE DATA · NO PERFORMANCE CLAIMS</span></header>
 <div class="content" id="app"></div>
</div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div class="tip" id="tip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { KINDS, STAGES, clone, latest, versionOf, definitionOf, outcomeOf, processOf, sampleNote, esc, thesisSentence } from './strategies-shape-data.mjs';
import { openStudio, sampleIllustrations, renderPng, sourceLabel, draw as drawIll, W as IW, H as IH } from './strategies-capture.mjs';
const { strategies, plays } = clone();
const SAMPLES = sampleIllustrations();
strategies.forEach(s => { s.illustrations = SAMPLES[s.id] ?? []; });
// Rules are shown grouped by kind; their numbers (and the pins on pictures) follow that order.
const orderedRules = rules => Object.keys(KINDS).flatMap(k => rules.filter(r => r.kind === k));
const ruleNo = rules => { const o = orderedRules(rules); return id => { const i = o.findIndex(r => r.id === id); return i < 0 ? '·' : i + 1; }; };
const ruleNoOf = s => ruleNo(definitionOf(s).rules);
const KLABEL = { setup: 'Example', counterexample: 'Counterexample', explain: 'Explains rules' };
const refreshPngs = s => s.illustrations.forEach(il => { il.png = renderPng(il.state, ruleNoOf(s)); });
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let tt; const toast = m => { $('#toast').textContent = m; clearTimeout(tt); tt = setTimeout(() => $('#toast').textContent = '', 3600); };
const S = id => strategies.find(s => s.id === id);
const playsOf = (sid, v = 'all') => plays.filter(p => p.s === sid && (v === 'all' || p.v === +v)).sort((a, b) => a.date.localeCompare(b.date));
const fmtR = r => r == null ? '—' : (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1) + 'R';
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const TFS = ['1m', '5m', '15m', '1H', '4H', '1D', '1W'], REGIMES = ['Trend', 'Range', 'High volatility', 'Low volatility'];
const blankDef = () => ({ thesis: { when: '', expect: '', because: '' }, scope: { instruments: [], markets: '', direction: 'Long', timeframes: { setup: '4H', entry: '1H' }, regime: [], sessions: 'Any' }, rules: [], invalidation: '', reviewPlan: { predictions: [], stopRule: '', checkEvery: 10 }, illustrations: [] });
let route = { page: 'library' }, stageFilter = 'all', vFilter = 'all', cellFilter = null, uid = 100, illSel = 0;
const go = r => { route = r; cellFilter = null; vFilter = 'all'; illSel = 0; render(); window.scrollTo(0, 0); };

/* ---------- small renderers ---------- */
const stageBadge = s => `<span class="badge ${s.stage}">${STAGES[s.stage].label}</span>`;
const scopeChips = sc => [sc.direction, sc.timeframes.setup && `${sc.timeframes.setup} setup`, ...sc.regime].filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join('');
const stripOf = s => playsOf(s.id).map(p => { const o = outcomeOf(p).replace(' ', ''); return `<i class="${o} ${processOf(p, s) === 'Deviated' ? 'dev' : ''}" title="${esc(`${p.id} · v${p.v} · ${outcomeOf(p)} · ${processOf(p, s)}`)}"></i>`; }).join('');
function rulesByKind(rules, ills = []) {
  const no = ruleNo(rules);
  return `<div class="rule-groups">${Object.entries(KINDS).map(([k, meta]) => { const rs = rules.filter(r => r.kind === k); if (!rs.length) return ''; return `<div class="rg"><h4><span class="kind ${k}">${meta.label}</span><span>${esc(meta.hint)}</span></h4><ul class="rl">${rs.map(r => { const n = ills.filter(il => il.rules.includes(r.id)).length; return `<li data-hrule="${esc(r.id)}"><span class="rn">${no(r.id)}</span><span style="flex:1">${esc(r.text)}</span>${r.required ? '' : '<span class="opt">nice to have</span>'}${n ? `<button class="ghost pic" data-showrule="${esc(r.id)}" title="Show it on a picture">${n} picture${n > 1 ? 's' : ''}</button>` : ''}</li>`; }).join('')}</ul></div>`; }).join('')}</div>`;
}
const schematic = (kind, seed = 1) => { // decorative placeholder, not market data
  const pts = Array.from({ length: 14 }, (_, i) => { const base = kind === 'counterexample' ? 30 + i * 1.6 : 26 + Math.sin(i / 2 + seed) * 8 - (i === 6 ? 10 : 0) + (i > 7 ? -(i - 7) * 1.5 : 0); return `${4 + i * 6},${Math.max(6, Math.min(48, base))}`; }).join(' ');
  return `<svg viewBox="0 0 86 52" aria-hidden="true"><line x1="0" x2="86" y1="34" y2="34" stroke="#4c596b" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="${kind === 'counterexample' ? '#d96a4a' : '#9fb0c8'}" stroke-width="1.6"/></svg>`;
};

/* ---------- Library ---------- */
function renderLibrary() {
  const order = ['testing', 'inuse', 'idea', 'shelved', 'retired'];
  const list = strategies.filter(s => stageFilter === 'all' || s.stage === stageFilter);
  return `<div class="heading"><div><div class="eyebrow">Hypotheses, not promises</div><h1>Strategies</h1><p>Strategies are generic: they describe a kind of situation, not an asset. Each one is written once (definition, with pictures from any asset) and then judged by the Plays that used it (behaviour). Editing rules never sits next to results.</p></div><button class="primary" data-act="new">+ New strategy</button></div>
  <div class="shape-note"><span><b>1</b> Library: what you have and where each one stands</span><span><b>2</b> Strategy: Definition · Behaviour · History</span><span><b>3</b> Create: guided builder, ends as Idea or frozen v1</span><span><b>4</b> Edit: working copy, freeze a new version with a reason</span></div>
  <div class="filters" role="group" aria-label="Filter by stage"><button class="chip" data-stagef="all" aria-pressed="${stageFilter === 'all'}">All ${strategies.length}</button>${order.map(k => `<button class="chip" data-stagef="${k}" aria-pressed="${stageFilter === k}">${STAGES[k].label} ${strategies.filter(s => s.stage === k).length}</button>`).join('')}</div>
  ${order.map(k => { const g = list.filter(s => s.stage === k); if (!g.length) return ''; return `<div class="group-title">${STAGES[k].label} <span class="faint" style="letter-spacing:0;text-transform:none;font-weight:400">${esc(STAGES[k].hint)}</span></div>${g.map(s => { const d = definitionOf(s), v = latest(s), ps = playsOf(s.id); const il = s.illustrations[0]; return `<button class="s-row" data-open="${s.id}"><span class="thumb">${il?.png ? `<img src="${il.png}" alt="">` : 'No picture yet'}</span><div><h3>${esc(s.name)}</h3><p>${esc(d.thesis.when ? thesisSentence(d.thesis) : 'No thesis yet.')}</p></div><div class="scope">${scopeChips(d.scope)}</div><div><div class="meta">${v ? `Plays use <b style="color:var(--foreground);font-weight:600">v${v.n}</b>` : 'Not frozen yet'} · ${ps.length} play${ps.length === 1 ? '' : 's'}${ps.length ? ` · last ${fmtDate(ps.at(-1).date)}` : ''}</div><div class="strip" aria-hidden="true">${stripOf(s)}</div></div></button>`; }).join('')}`; }).join('') || '<p class="muted" style="font-size:11px">No strategies at this stage.</p>'}
  <p class="legend" style="margin-top:14px"><span><i style="background:var(--pos-mark)"></i>Positive</span><span><i style="background:var(--flat-mark)"></i>Flat</span><span><i style="background:var(--neg-mark)"></i>Negative</span><span><i style="border:2px solid var(--warning)"></i>A rule was broken</span><span><i style="border:1.5px solid #6c7685;border-radius:50%"></i>Missed or cancelled</span><span><i style="border:1.5px dashed #6c7685"></i>In progress</span></p>`;
}

/* ---------- Strategy page ---------- */
function renderStrategy() {
  const s = S(route.id), v = latest(s), tab = route.tab || 'definition', ps = playsOf(s.id);

function rChart(s, ps) {

  const n = ps.length, step = (W - padL - padR) / Math.max(n, 1), bw = Math.max(6, Math.min(30, step - 6));

  g += `<line x1="${padL}" x2="${W - padR}" y1="${zero}" y2="${zero}" stroke="#5a6574"/><text x="${padL - 8}" y="${zero + 3}" text-anchor="end" font-size="10" fill="#7f8896">0</text>`;

      m = pr === 'Deviated' ? `<rect x="${cx - bw / 2 + .75}" y="${y + .75}" width="${bw - 1.5}" height="${Math.max(1, h - 1.5)}" rx="3" fill="#171a1f" stroke="${col}" stroke-width="2"/>` : `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${col}"/>`;
    } else if (p.status === 'Cancelled') m = `<circle cx="${cx}" cy="${lane}" r="5.5" fill="none" stroke="${pr === 'Deviated' ? '#edd49e' : '#8c96a5'}" stroke-width="1.5"/>`;
    else m = `<rect x="${cx - bw / 2 + .75}" y="${zero - 18}" width="${bw - 1.5}" height="36" rx="3" fill="none" stroke="#8c96a5" stroke-dasharray="3 3"/>`;

  });

}

/* history */
function rulesDiff(prev, next) {
  const pm = new Map(prev.map(r => [r.id, r])), nids = new Set(next.map(r => r.id)), out = [];
  next.forEach(r => { const o = pm.get(r.id); if (!o) out.push(`<li class="add">+ ${esc(r.text)}<i>added · ${KINDS[r.kind].label}</i></li>`); else if (o.text !== r.text) out.push(`<li class="chg">~ ${esc(r.text)}<i>was “${esc(o.text)}”</i></li>`); else if (o.kind !== r.kind || o.required !== r.required) out.push(`<li class="chg">~ ${esc(r.text)}<i>${o.kind !== r.kind ? `${KINDS[o.kind].label} → ${KINDS[r.kind].label}` : r.required ? 'now must-have' : 'now nice to have'}</i></li>`); });
  prev.filter(r => !nids.has(r.id)).forEach(r => out.push(`<li class="rem">− ${esc(r.text)}<i>removed</i></li>`));
  return out;
}
function renderHistory(s) {

  return `<p class="why"><strong>History</strong> keeps every frozen version and why it changed, so you always know which wording a Play was tested against.</p><div class="panel">${[...s.versions].reverse().map(v => { const prev = versionOf(s, v.n - 1), d = prev ? rulesDiff(prev.rules, v.rules) : [], ps = playsOf(s.id, v.n); const other = []; if (prev && prev.invalidation !== v.invalidation) other.push('Invalidation reworded'); if (prev && JSON.stringify(prev.scope) !== JSON.stringify(v.scope)) other.push('Scope changed'); if (prev && JSON.stringify(prev.thesis) !== JSON.stringify(v.thesis)) other.push('Thesis reworded'); return `<div class="vh"><div class="when"><strong>v${v.n}${v === latest(s) ? ' · current' : ''}</strong><small>${fmtDate(v.date)} · ${ps.length} play${ps.length === 1 ? '' : 's'}</small></div><div><p class="reason">${esc(v.reason)}</p>${prev ? `<ul class="diff">${d.join('') || '<li class="faint">No rule changes</li>'}${other.map(o => `<li class="chg">~ ${esc(o)}</li>`).join('')}</ul>` : `<ul class="diff">${v.rules.map(r => `<li>${esc(r.text)}</li>`).join('')}</ul>`}</div></div>`; }).join('')}</div>`;

}
function freezeDialog() {
  const s = S(editing.id), { base, wc } = editing, n = base ? base.n + 1 : 1, ch = changesOf();
  if (base && !ch.length) return toast('Nothing changed since the frozen version.');
  if (freezeProblems({ ...wc, name: s.name }).length) return toast(`Still needs ${freezeProblems({ ...wc, name: s.name }).join(', ')}.`);
  openDialog(`<h2>Freeze as v${n}</h2><p class="muted" style="font-size:11px;line-height:1.8;margin-bottom:10px">New Plays will use v${n}. Plays that already used v${base ? base.n : 1} keep it.</p><ul class="changes" style="margin-bottom:12px">${ch.map(x => `<li>${esc(x)}</li>`).join('')}</ul><label class="field">Why is it changing? (required)<textarea id="why" rows="3" required maxlength="600" placeholder="What did the plays show?"></textarea></label><div class="actions"><button type="button" data-cancel>Cancel</button><button class="primary">Freeze v${n}</button></div>`, () => {
    const why = $('#why').value.trim(); if (!why) return false;
    s.versions.push({ n, date: '2026-10-05', reason: why, thesis: wc.thesis, scope: wc.scope, invalidation: wc.invalidation, rules: wc.rules.filter(r => r.text.trim()) });
    s.reviewPlan = wc.reviewPlan; delete s.working;
    refreshPngs(s);
    if (s.stage === 'idea') { s.stage = 'testing'; s.stageReason = 'v1 frozen; collecting plays.'; s.stageDate = '2026-10-05'; }
    toast(`v${n} frozen. New Plays will use it.`); go({ page: 'strategy', id: s.id, tab: 'history' });
  });
}
function stageDialog() {
  const s = S(route.id);
  openDialog(`<h2>Change stage</h2><p class="muted" style="font-size:11px;line-height:1.8;margin-bottom:12px">A stage is your decision, not a verdict computed from results. It is not a new version.</p><div class="stack">${Object.entries(STAGES).map(([k, m]) => `<label style="display:flex;gap:10px;align-items:flex-start;font-size:12px"><input type="radio" name="stg" value="${k}" ${k === s.stage ? 'checked' : ''} ${k !== 'idea' && !s.versions.length ? 'disabled' : ''}><span><b style="font-weight:600">${m.label}</b><br><small class="muted">${esc(m.hint)}</small></span></label>`).join('')}</div><label class="field" style="margin-top:14px">Reason (required)<textarea id="stg-why" rows="2" required maxlength="400"></textarea></label><div class="actions"><button type="button" data-cancel>Cancel</button><button class="primary">Save stage</button></div>`, () => {
    const why = $('#stg-why').value.trim(); if (!why) return false;
    s.stage = dform.querySelector('[name=stg]:checked').value; s.stageReason = why; s.stageDate = '2026-10-05'; render(); toast(`Stage set to ${STAGES[s.stage].label}.`);
  });
}
function pinDialog(pid) {
  const s = S(route.id), p = plays.find(x => x.id === pid);
  openDialog(`<h2>Pin ${esc(p.id)} to the definition</h2><p class="muted" style="font-size:11px;line-height:1.8;margin-bottom:12px">${esc(p.title)} · v${p.v}. Pinned plays appear under Examples on the Definition tab.</p><div class="seg" style="margin-bottom:12px"><button type="button" data-k="setup" aria-pressed="true">Example</button><button type="button" data-k="counterexample" aria-pressed="false">Counterexample</button></div><label class="field">Caption<input id="pin-cap" maxlength="160" value="${esc(p.note || '')}" required></label><div class="actions"><button type="button" data-cancel>Cancel</button><button class="primary">Pin</button></div>`, () => {
    const cap = $('#pin-cap').value.trim(); if (!cap) return false;
    s.examples.push({ playId: pid, kind: dform.querySelector('[data-k][aria-pressed=true]').dataset.k, caption: cap }); toast('Pinned to the definition.');
  });
  dform.querySelectorAll('[data-k]').forEach(x => x.onclick = () => dform.querySelectorAll('[data-k]').forEach(y => y.setAttribute('aria-pressed', y === x)));
}

/* tooltips on chart marks */
const tip = $('#tip');
document.addEventListener('pointermove', e => {
  const g = e.target.closest?.('.mk'); if (!g) { tip.hidden = true; return; }
  const d = JSON.parse(g.dataset.tip);
  tip.innerHTML = `<b>${esc(d.id)}</b> ${esc(d.t)}<br>v${d.v} · ${esc(d.o)} · ${esc(d.pr)}${d.note ? `<br><span class="muted">${esc(d.note)}</span>` : ''}`;
  tip.hidden = false; const x = Math.min(e.clientX + 14, innerWidth - 270); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
render();
document.fonts.load('600 12px Manrope').finally(() => { strategies.forEach(refreshPngs); render(); });
</script>
</body>
</html>
